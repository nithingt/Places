<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Places</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Live camera feed fills the screen -->
  <video id="camera" autoplay playsinline muted></video>
  <div id="vignette"></div>
  <canvas id="motes"></canvas>

  <!-- The place-name reveal -->
  <div id="reveal" aria-live="polite">
    <div class="shade"></div>
    <div class="label" id="revealLabel">Region Discovered</div>
    <div class="rule top"><span></span><i></i><span></span></div>
    <h1 class="name" id="revealName"></h1>
    <div class="rule bottom"><span></span><i></i><span></span></div>
    <div class="sub" id="revealSub"></div>
  </div>

  <!-- Start screen: a tap is needed to unlock camera, location and sound -->
  <div id="start">
    <div class="start-inner">
      <h2>Places</h2>
      <p>Walk somewhere new.<br>The world will tell you where you are.</p>
      <button id="startBtn">Begin</button>
      <small>Uses your camera, location and sound.</small>
    </div>
  </div>

  <div id="status"></div>

  <!-- Record a video of the reveal -->
  <div id="controls">
    <span id="recordTime">0:00</span>
    <button id="recordBtn" aria-label="Record video"><span></span></button>
  </div>

  <!-- Shown after a recording finishes -->
  <div id="preview" role="dialog" aria-label="Your recording">
    <video id="previewVideo" playsinline loop controls></video>
    <div class="preview-actions">
      <button id="shareBtn">Share</button>
      <button id="saveBtn">Save</button>
      <button id="discardBtn">Close</button>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="app.js"></script>
  <script src="recorder.js"></script>
</body>
</html>
